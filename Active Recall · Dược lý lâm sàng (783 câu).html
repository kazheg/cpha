<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Active Recall · Dược lý lâm sàng</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
  --tx:#e8eaf0; --tx2:#9aa3b2; --acc:#5b8cff; --ok:#2fbf71; --no:#f0564a; --warn:#f3b23c;
}
@media (prefers-color-scheme: light){
  :root{--bg:#f6f7fa;--panel:#fff;--panel2:#f0f2f7;--line:#dfe3ea;--tx:#16181d;--tx2:#5d6675;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 ui-sans-serif,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 14px}
.wrap{max-width:860px;margin:0 auto}
h1{font-size:17px;margin:0 0 8px;font-weight:650;letter-spacing:.2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select{font:inherit;color:var(--tx);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.sm{padding:5px 9px;font-size:14px}
main{max-width:860px;margin:0 auto;padding:16px 14px 80px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.meta{font-size:12.5px;color:var(--tx2);margin-bottom:8px;display:flex;justify-content:space-between;gap:10px}
.qt{font-size:18px;font-weight:600;margin-bottom:14px;white-space:pre-wrap}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:9px;transition:.12s}
.opt:hover{border-color:var(--acc)}
.opt .k{flex:0 0 22px;height:22px;border-radius:6px;background:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--tx2)}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.opt.good .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--no);background:color-mix(in srgb,var(--no) 14%,transparent)}
.opt.bad .k{background:var(--no);color:#fff}
.opt[disabled]{cursor:default}
.ex{border-left:3px solid var(--acc);background:var(--panel2);border-radius:0 10px 10px 0;padding:11px 13px;font-size:15px;color:var(--tx);margin-top:4px}
.ex b{color:var(--acc)}
.bar{height:5px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:8px}
.bar>div{height:100%;background:var(--acc);width:0;transition:.25s}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--tx2)}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.no{color:var(--no);border-color:var(--no)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.lesson{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}
.lesson:hover{border-color:var(--acc)}
.lesson .n{font-size:12px;color:var(--tx2)}
.lesson b{font-weight:600;font-size:15px}
.hide{display:none!important}
.fc{min-height:190px;display:flex;flex-direction:column;justify-content:center}
.big{font-size:26px;font-weight:700;text-align:center}
.center{text-align:center}
.stat{display:flex;gap:14px;justify-content:center;margin:10px 0;flex-wrap:wrap}
.stat div{text-align:center}
.stat .v{font-size:26px;font-weight:700}
.stat .l{font-size:12px;color:var(--tx2)}
.note{font-size:13.5px;color:var(--tx2)}
kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:12px}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--no)}
.rev{border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px;background:var(--panel2)}
.rev .q{font-weight:600;margin-bottom:6px}
.rev .a{font-size:14.5px}
.rev .a i{font-style:normal;color:var(--ok)}
.rev .a s{color:var(--no)}
footer{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);padding:9px 14px}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Active Recall · Dược lý lâm sàng <span class="pill" id="count"></span></h1>
  <div class="row">
    <button class="sm" id="bHome">Mục lục</button>
    <select id="selMode">
      <option value="quiz">Trắc nghiệm</option>
      <option value="flash">Flashcard</option>
    </select>
    <select id="selOrder">
      <option value="seq">Thứ tự bài</option>
      <option value="rand">Xáo trộn</option>
    </select>
    <button class="sm" id="bWrong">Ôn câu sai (<span id="nWrong">0</span>)</button>
    <button class="sm pri" id="bExam">Thi thử 50 câu / 30 phút</button>
    <span class="timer hide" id="timer"></span>
  </div>
  <div class="bar"><div id="prog"></div></div>
</div></header>
<main>
  <div id="home"></div>
  <div id="play" class="hide"></div>
  <div id="result" class="hide"></div>
</main>
<footer class="hide" id="foot"><div class="wrap row" style="justify-content:space-between">
  <div class="row">
    <button class="sm" id="bPrev">← Trước</button>
    <button class="sm" id="bNext">Sau →</button>
  </div>
  <div class="row">
    <span class="pill ok" id="sOk">0 đúng</span>
    <span class="pill no" id="sNo">0 sai</span>
    <button class="sm" id="bEnd">Kết thúc</button>
  </div>
</div></footer>

ông khí O₂)."}, {"l": 1, "lt": "Thuốc tê", "sec": "Ngộ độc LAST", "q": "Thuốc kiểm soát co giật trong ngộ độc LAST, TRỪ:", "opts": ["Propofol", "Atropin", "Midazolam", "Thiopental"], "ans": 1, "ex": "Co giật: thiopental hoặc propofol hoặc midazolam. Atropin dùng cho mạch chậm."}, {"l": 1, "lt": "Thuốc tê", "sec": "Ngộ độc LAST", "q": "Trong LAST, mạch chậm được xử trí bằng:", "opts": ["Midazolam", "Propofol", "Atropin", "Sốc điện"], "ans": 2, "ex": "Mạch CHẬM → atropin; vận mạch: dobutamin, adrenalin, ephedrin; nhịp nhanh THẤT → sốc điện."}, {"l": 1, "lt": "Thuốc tê", "sec": "Ngộ độc LAST", "q": "Trong LAST, nhịp nhanh thất được xử trí bằng:", "opts": ["Ephedrin", "Sốc điện", "Thiopental", "Atropin"], "ans": 1, "ex": "Nhịp nhanh thất → sốc điện."}, {"l": 1, "lt": "Thuốc tê", "sec": "Ngộ độc LAST", "q": "Chỉ định liệu pháp lipid 20 % trong ngộ độc LAST:", "opts": ["Bắt buộc khi không đáp ứng điều trị tiêu chuẩn", "Chỉ dùng phòng ngừa trước gây tê", "Dùng thường quy cho mọi trường hợp ngay từ đầu", "Chỉ dùng khi co giật"], "ans": 0, "ex": "Lipid 20 %: BẮT BUỘC khi không đáp ứng điều trị tiêu chuẩn."}, {"l": 1, "lt": "Thuốc tê", "sec": "Ngộ độc LAST", "q": "Cơ chế của liệu pháp lipid 20 % trong ngộ độc thuốc tê:", "opts": ["Tăng chuyển hóa thuốc tê ở gan", "Tăng thải thuốc tê qua thận", "Tạo \"bể chứa\" kéo phân tử thuốc tan lipid khỏi huyết tương, hoạt hóa ATP, giảm gắn cơ tim", "Đối kháng cạnh tranh tại kênh Na⁺"], "ans": 2, "ex": "Kéo thuốc tan lipid khỏi huyết tương, hoạt hóa ATP + ↓ gắn kết cơ tim (tạo \"BỂ CHỨA\")."}, {"l": 1, "lt": "Thuốc tê", "sec": "Ngộ độc LAST", "q": "Phác đồ lipid 20 %, nếu sau 5 phút chưa ổn định thì:", "opts": ["Bolus lần 2, vẫn truyền (có thể gấp đôi tốc độ)", "Ngừng truyền lipid", "Chuyển sang truyền NaCl 0,9 %", "Giảm một nửa tốc độ truyền"], "ans": 0, "ex": "1 bolus IV chậm trên 1 phút → 2 truyền liên tục → 3 sau 5 phút chưa ổn: bolus lần 2, vẫn truyền (có thể gấp đôi tốc độ) → 4 truyền đến khi ổn định."}, {"l": 1, "lt": "Thuốc tê", "sec": "Nha khoa", "q": "Thuốc dùng để bôi tê trong nha khoa là:", "opts": ["Tetracain 0,5 %", "Lidocain 10 %, benzocain 4 % hoặc 10 %", "Procain 1 %", "Bupivacain 0,5 %"], "ans": 1, "ex": "Bôi tê: sát khuẩn, lau khô → viên bông thấm thuốc → chờ vài phút → can thiệp NHANH; thuốc: lidocain 10 %, benzocain 4 % hoặc 10 %."}, {"l": 1, "lt": "Thuốc tê", "sec": "Nha khoa", "q": "Lidocain 10 % KHÔNG dùng cho:", "opts": ["Phun tê", "Gây tê bề mặt niêm mạc", "Bôi tê", "Tiêm gây tê"], "ans": 3, "ex": "Lidocain 10 % dùng bôi tê và phun tê (bề mặt) trong nha khoa; không dùng tiêm."}, {"l": 1, "lt": "Thuốc tê", "sec": "Nha khoa", "q": "Kỹ thuật dùng ethyl clorid trong nha khoa:", "opts": ["Xịt sát niêm mạc liên tục cho đến khi da đông cứng", "Tiêm dưới niêm mạc", "Bôi bằng viên bông", "Dốc ngược chai, xịt cách niêm mạc 2 cm rồi đưa xa từ từ đến 15 cm; dừng trước khi da đông cứng"], "ans": 3, "ex": "Chờ lớp này tan → xịt lần 2 → dừng trước khi da ĐÔNG CỨNG (vùng tê trắng ra) → can thiệp."}, {"l": 1, "lt": "Thuốc tê", "sec": "Nha khoa", "q": "Gây tê bề mặt trong nha khoa được dùng cho các trường hợp, TRỪ:", "opts": ["Lấy cao răng", "Nhổ răng nhiều chân", "Chích áp xe", "Nhổ răng lung lay"], "ans": 1, "ex": "Bề mặt: nhổ răng lung lay, lấy cao, chích áp xe. Nhổ răng 1 hay nhiều chân → tiêm gây tê niêm mạc."}, {"l": 1, "lt": "Thuốc tê", "sec": "Nha khoa", "q": "Khi gây tê dây chằng trong nha khoa, kim được đặt:", "opts": ["Tiêm thẳng vào dây thần kinh", "Cách niêm mạc 2 cm", "Vuông góc với trục răng", "Song song trục răng, phía gần và xa, mép kim ép sát chân răng, xuống sâu + sức ép mạnh"], "ans": 3, "ex": "Gây tê DÂY CHẰNG: kim SONG SONG trục răng, phía GẦN + XA, ép sát chân răng, xuống sâu, sức ép MẠNH."}, {"l": 1, "lt": "Thuốc tê", "sec": "Nha khoa", "q": "Thuốc tê hay dùng để tiêm trong nha khoa, TRỪ:", "opts": ["Bupivacain", "Prilocain", "Lidocain", "Cocain"], "ans": 3, "ex": "Tiêm: bupivacain, lidocain, prilocain. Biến chứng: gãy kim, đau khi tiêm, nóng rát/tê, dị cảm kéo dài, n ; trẻ em bồn chồn, ra nhiều mồ hôi (dấu hiệu vành khăn), chán ăn."}, {"l": 14, "lt": "Vitamin", "sec": "Vitamin D", "q": "Thừa vitamin D mức độ nặng gây:", "opts": ["Tổn thương thận không hồi phục, calci hóa các tạng, suy thận cấp, rối loạn nhịp tim", "Chỉ gây buồn nôn nhẹ", "Chảy máu", "Quáng gà"], "ans": 0, "ex": "Mức độ nhẹ: buồn nôn, nôn, chán ăn, giảm cân, tiêu chảy hoặc táo bón, dễ kích thích, mệt mỏi, yếu cơ."}, {"l": 14, "lt": "Vitamin", "sec": "Vitamin D", "q": "Thuốc nào dùng dự phòng còi xương?", "opts": ["Retinol", "Calcitriol", "Cholecalciferol", "Calcitonin"], "ans": 2, "ex": "Cholecalciferol (vitamin D3) chỉ định cho thiếu vitamin D do dinh dưỡng và dự phòng còi xương; ergocalciferol là vitamin D2 nguồn gốc thực vật."}, {"l": 14, "lt": "Vitamin", "sec": "Vitamin D", "q": "Chỉ định của vitamin D, TRỪ:", "opts": ["Loạn dưỡng xương hoặc hạ calci máu thứ phát do suy thận mạn", "Dự phòng loãng xương khi dùng corticoid kéo dài", "Dự phòng và điều trị còi xương ở trẻ em", "Cường cận giáp nguyên phát có tăng calci máu"], "ans": 3, "ex": "Vitamin D còn dùng trong suy cận giáp để dự phòng và điều trị co giật."}, {"l": 14, "lt": "Vitamin", "sec": "Vitamin E", "q": "Vitamin E gồm:", "opts": ["Chỉ có α-tocopherol", "8 hợp chất tự nhiên: 4 tocopherol và 4 tocotrienol, trong đó α- và γ-tocopherol có hoạt tính cao nhất", "3 dạng: pyridoxin, pyridoxal, pyridoxamin", "2 dạng: D2 và D3"], "ans": 1, "ex": "Vitamin E dự trữ ở gan, mô mỡ và cơ; nguồn giàu nhất là dầu mầm lúa mì, dầu hướng dương, dầu đậu nành, dầu ngô."}, {"l": 14, "lt": "Vitamin", "sec": "Vitamin E", "q": "Vai trò sinh lý của vitamin E, TRỪ:", "opts": ["Chống oxy hóa mạnh, bảo vệ màng tế bào và LDL-C khỏi oxy hóa", "Tăng kết tập tiểu cầu", "Ức chế protein kinase C liên quan sinh trưởng, biệt hóa tế bào", "Tăng hoạt động nitric oxide synthase và prostacyclin gây giãn mạch"], "ans": 1, "ex": "Vitamin E ỨC CHẾ kết tập tiểu cầu và giảm dính tế bào máu vào nội mô."}, {"l": 14, "lt": "Vitamin", "sec": "Vitamin E", "q": "Thiếu vitamin E ở trẻ sinh non gây:", "opts": ["Beri-Beri", "Quáng gà", "Còi xương", "Thiếu máu tan máu, xuất huyết não thất, xơ hóa sau thủy tinh thể có thể gây mù"], "ans": 3, "ex": "Ở người lớn, thiếu vitamin E gây giảm phối hợp vận động, mất thăng bằng, Babinski dương tính, bệnh võng mạc sắc tố, yếu cơ, tăng CPK và LDH."}, {"l": 14, "lt": "Vitamin", "sec": "Vitamin E", "q": "Lưu ý khi dùng vitamin E liều cao, TRỪ:", "opts": ["Tăng nguy cơ chảy máu, đột quỵ xuất huyết", "Nên ngừng trước phẫu thuật lớn 1 tháng", "Làm giảm tác dụng thuốc chống đông", "Liều cao kéo dài có thể tăng tỷ lệ tử vong do mọi nguyên nhân"], "ans": 2, "ex": "Vitamin E LÀM TĂNG tác dụng của warfarin và aspirin."}, {"l": 14, "lt": "Vitamin", "sec": "Vitamin E", "q": "Chỉ định của vitamin E, TRỪ:", "opts": ["Trẻ kém hấp thu do xơ nang tuyến tụy, teo đường mật", "Điều trị còi xương", "Trẻ sinh non rất nhẹ cân dưới 1500 g", "Người có chế độ ăn nghèo chất béo"], "ans": 1, "ex": "Dự phòng xơ vữa động mạch và kích thích miễn dịch vẫn đang được nghiên cứu."}, {"l": 14, "lt": "Vitamin", "sec": "Vitamin B1", "q": "Dạng coenzym hoạt động của vitamin B1 là:", "opts": ["NAD và NADP", "Thiamin pyrophosphat (TPP)", "Pyridoxal 5-phosphat", "Acid ascorbic"], "ans": 1, "ex": "Vitamin B1 còn gọi là thiamin, yếu tố chống beri-beri, có nhiều nhất trong nấm men bia."}, {"l": 14, "lt": "Vitamin", "sec": "Vitamin B1", "q": "Vai trò của vitamin B1, TRỪ:", "opts": ["Tham gia chuyển hóa acetylcholin, adrenalin, serotonin", "Coenzym cho các enzym khử carboxyl của acid α-keto", "Chuyển hóa năng lượng từ carbohydrat, protein, lipid, đặc biệt giáng hóa glucose thành ATP", "Là coenzym cho phản ứng hydroxyl hóa tổng hợp collagen"], "ans": 3, "ex": "Tổng hợp collagen là vai trò của vitamin C."}, {"l": 14, "lt": "Vitamin", "sec": "Vitamin B1", "q": "Beri-Beri thể \"ướt\" có đặc điểm:", "opts": ["Chỉ gây thiếu máu", "Chỉ biểu hiện ở mắt", "Sụt cân nhanh, suy dinh dưỡng nặng, phù phổi", "Ít thay đổi cân nặng, tổn thương  "sec": "PPI", "q": "Chỉ định của PPI, TRỪ:", "opts": ["Diệt trừ H. pylori khi phối hợp kháng sinh", "Điều trị và dự phòng tái phát loét dạ dày – tá tràng", "Tiêu chảy cấp do nhiễm khuẩn", "Loét do NSAIDs và dự phòng ở bệnh nhân nguy cơ cao"], "ans": 2, "ex": "PPI còn dùng cho GERD, viêm thực quản ăn mòn và hội chứng Zollinger-Ellison với liều cao hơn thông thường."}, {"l": 15, "lt": "Tiêu hóa (antacid, H2, PPI, oresol)", "sec": "PPI", "q": "Tác dụng không mong muốn phổ biến nhất khi dùng PPI ngắn hạn là:", "opts": ["Tiêu chảy nặng", "Gãy xương", "Đau đầu, gặp ở 2–7 % bệnh nhân", "Viêm phổi"], "ans": 2, "ex": "Các tác dụng phụ ngắn hạn khác: buồn nôn, đau bụng, tiêu chảy, táo bón, khô miệng, chóng mặt, tăng men gan thoáng qua."}, {"l": 15, "lt": "Tiêu hóa (antacid, H2, PPI, oresol)", "sec": "PPI", "q": "Dùng PPI kéo dài gây các vấn đề dinh dưỡng sau, TRỪ:", "opts": ["Giảm hấp thu vitamin B12", "Giảm hấp thu vitamin A", "Tăng nguy cơ gãy xương hông, cổ tay, cột sống", "Giảm hấp thu canxi và magnesi"], "ans": 1, "ex": "Dùng kéo dài còn tăng nguy cơ viêm đại tràng giả mạc do C. difficile, viêm phổi cộng đồng và tăng gastrin máu kéo dài làm tăng nguy cơ ung thư dạ dày."}, {"l": 15, "lt": "Tiêu hóa (antacid, H2, PPI, oresol)", "sec": "So sánh H2 – PPI", "q": "So sánh kháng H2 và PPI, ý nào ĐÚNG?", "opts": ["Cả hai đều rất nhanh bị lờn thuốc", "Kháng H2 gắn hồi phục, ức chế acid khoảng 12 giờ ở mức 60–70 %; PPI gắn cộng hóa trị không hồi phục, ức chế khoảng 24 giờ ở mức trên 90 %", "Kháng H2 mạnh hơn PPI", "PPI gắn hồi phục với bơm proton"], "ans": 1, "ex": "Kháng H2 nhanh bị lờn thuốc, còn PPI rất ít khi bị lờn thuốc."}, {"l": 15, "lt": "Tiêu hóa (antacid, H2, PPI, oresol)", "sec": "Oresol", "q": "Cơ chế hấp thu nước của oresol dựa trên:", "opts": ["Hấp thu thụ động của natri qua kênh riêng", "Tác dụng thẩm thấu của glucose giữ nước trong lòng ruột", "Kích thích bơm Na⁺/K⁺ ATPase ở niêm mạc", "Glucose hấp thu tích cực qua kênh SGLT1, kéo theo Na⁺ theo tỷ lệ 1:1, từ đó tạo gradient thẩm thấu kéo nước vào máu"], "ans": 3, "ex": "Cơ chế này vẫn nguyên vẹn ngay cả khi tiêu chảy do độc tố vi khuẩn như V. cholerae."}, {"l": 15, "lt": "Tiêu hóa (antacid, H2, PPI, oresol)", "sec": "Oresol", "q": "Vai trò của glucose trong oresol là:", "opts": ["Chỉ cung cấp năng lượng", "Vừa cung cấp năng lượng vừa là yếu tố then chốt giúp hấp thu nước và điện giải", "Chỉ tạo vị ngọt dễ uống", "Chỉ để làm tăng áp lực thẩm thấu"], "ans": 1, "ex": "Không có glucose thì Na⁺ không được hấp thu qua SGLT1."}, {"l": 15, "lt": "Tiêu hóa (antacid, H2, PPI, oresol)", "sec": "Oresol", "q": "Thành phần nào trong oresol có vai trò chống nhiễm toan chuyển hóa?", "opts": ["Natri citrat", "Glucose khan", "Natri clorid", "Kali clorid"], "ans": 0, "ex": "ORS áp lực thẩm thấu thấp: NaCl 2,6 g/L, KCl 1,5 g/L, Na citrat 2,9 g/L, glucose khan 13,5 g/L, có thể thêm kẽm 20 mg."}, {"l": 15, "lt": "Tiêu hóa (antacid, H2, PPI, oresol)", "sec": "Oresol", "q": "Kẽm trong điều trị tiêu chảy có tác dụng:", "opts": ["Trung hòa độc tố vi khuẩn", "Làm chậm nhu động ruột", "Diệt vi khuẩn gây tiêu chảy", "Tăng tái tạo niêm mạc ruột, tăng hoạt động enzym tiêu hóa, tăng đáp ứng miễn dịch, giảm tần suất và mức độ nặng của tiêu chảy"], "ans": 3, "ex": "Kẽm là thành phần tùy chọn nhưng được WHO khuyến khích."}, {"l": 15, "lt": "Tiêu hóa (antacid, H2, PPI, oresol)", "sec": "Oresol", "q": "So với oresol thông thường (311 mOsmol/L) thì oresol áp lực thẩm thấu thấp (245 mOsmol/L) có đặc điểm:", "opts": ["Tăng nguy cơ tăng natri máu", "Tăng lượng phân", "Giảm lượng phân, giảm số lần nôn và giảm nhu cầu truyền dịch tĩnh mạch", "Nôn nhiều hơn"], "ans": 2, "ex": "Cụ thể: giảm 25 % lượng phân, 30 % nôn, 33 % nhu cầu dịch truyền tĩnh mạch; đồng thời tránh nguy cơ tăng natri máu, kiềm máu và dễ uống hơn."}, {"l": 15, "lt": "Tiêu hóa (antacid, H2, PPI, oresol)", "sec": "Oresol", "q": "Nồng độ Na⁺ và tỷ lệ glucose : Na⁺ trong ORS áp lực thẩm thấu thấp là:", "opts": ["111 mmol/L và tỷ lệ 2:1", "50 mmol/L và tỷ trị phải theo dõi cả hiệu quả lẫn tác dụng phụ (đau cơ, tiêu cơ vân, tăng transaminase)."}, {"l": 18, "lt": "Đông máu & tiêu fibrin", "sec": "Vitamin K", "q": "Vitamin K giúp gan tổng hợp các yếu tố đông máu:", "opts": ["II, VII, IX, X", "III, IV, V, VI", "VIII, IX, XI, XII", "I, V, VIII, XIII"], "ans": 0, "ex": "Vitamin K là cofactor cho enzym microsom gan, carboxyl hóa acid glutamic thành γ-carboxyglutamyl để chuyển tiền chất thành dạng hoạt tính."}, {"l": 18, "lt": "Đông máu & tiêu fibrin", "sec": "Vitamin K", "q": "Sự khác nhau về hấp thu của các dạng vitamin K là:", "opts": ["K1 khuếch tán thụ động, K2 vận chuyển tích cực", "Cả ba đều không hấp thu qua đường uống", "Cả ba dạng đều vận chuyển tích cực", "Vitamin K1 hấp thu theo cơ chế vận chuyển tích cực, K2 và K3 khuếch tán thụ động"], "ans": 3, "ex": "Vitamin K tập trung ở gan."}, {"l": 18, "lt": "Đông máu & tiêu fibrin", "sec": "Vitamin K", "q": "Chỉ định của vitamin K, TRỪ:", "opts": ["Quá liều thuốc chống đông kháng vitamin K", "Huyết khối tĩnh mạch sâu", "Chảy máu do thiếu vitamin K", "Trẻ sinh non, kém hấp thu (bệnh Sprue, thiếu mật)"], "ans": 1, "ex": "Đường dùng: uống, tiêm dưới da, tiêm tĩnh mạch chậm."}, {"l": 18, "lt": "Đông máu & tiêu fibrin", "sec": "Vitamin K", "q": "Ngộ độc coumarin thì xử trí bằng gì?", "opts": ["Bổ sung amlodipin", "Bổ sung spironolacton", "Bổ sung vitamin K vì đây là yếu tố cần cho tổng hợp các yếu tố đông máu", "Bổ sung vitamin K kết hợp lợi tiểu"], "ans": 2, "ex": "Trong cấp cứu cần truyền huyết tương đông lạnh vì vitamin K tác dụng chậm."}, {"l": 18, "lt": "Đông máu & tiêu fibrin", "sec": "Heparin", "q": "Cơ chế tác dụng của heparin không phân cắt (UFH) là:", "opts": ["Chỉ bất hoạt yếu tố Xa", "Ức chế tổng hợp yếu tố đông máu ở gan", "Ức chế receptor P2Y12", "Hoạt hóa antithrombin III tạo phức hợp bền ức chế thrombin (IIa), IXa và Xa, tăng phản ứng gấp 1000 lần"], "ans": 3, "ex": "Heparin chiết từ phổi bò hoặc niêm mạc ruột lợn, mang điện âm, tính acid cao."}, {"l": 18, "lt": "Đông máu & tiêu fibrin", "sec": "Heparin", "q": "Khác biệt giữa heparin trọng lượng phân tử thấp (LMWH) và heparin thường là:", "opts": ["LMWH có nhiều tác dụng phụ hơn", "LMWH phải theo dõi aPTT thường xuyên", "LMWH chủ yếu bất hoạt yếu tố Xa, ít tác dụng trên thrombin nên không kéo dài aPTT; sinh khả dụng tiêm dưới da cao 90 %, t1/2 dài hơn", "LMWH ức chế thrombin mạnh hơn"], "ans": 2, "ex": "LMWH được thủy phân từ UFH; chuỗi không đủ dài để tạo phức hợp với thrombin."}, {"l": 18, "lt": "Đông máu & tiêu fibrin", "sec": "Heparin", "q": "Heparin không phân cắt cần theo dõi bằng xét nghiệm:", "opts": ["PT (prothrombin time)", "aPTT", "Số lượng hồng cầu", "INR"], "ans": 1, "ex": "UFH có t1/2 30–150 phút, cần cá thể hóa liều. LMWH không cần theo dõi aPTT, trừ bệnh nhân suy thận, béo phì hoặc có thai."}, {"l": 18, "lt": "Đông máu & tiêu fibrin", "sec": "Heparin", "q": "Đường dùng nào CẤM với heparin?", "opts": ["Tiêm tĩnh mạch", "Tiêm dưới da", "Truyền tĩnh mạch liên tục", "Tiêm bắp, vì gây khối máu tụ"], "ans": 3, "ex": "Tiêm tĩnh mạch cho tác dụng nhanh, tiêm dưới da sau khoảng 2 giờ."}, {"l": 18, "lt": "Đông máu & tiêu fibrin", "sec": "Heparin", "q": "Tác dụng không mong muốn của heparin không phân cắt, TRỪ:", "opts": ["Loãng xương khi dùng trên 6 tháng, rụng tóc, dị ứng", "Chảy máu", "Hoại tử da do ức chế protein C", "Giảm tiểu cầu do heparin (HIT)"], "ans": 2, "ex": "Hoại tử da do ức chế protein C là tác dụng phụ của warfarin. LMWH ít độc hơn UFH, ít gây loãng xương và giảm tiểu cầu hơn."}, {"l": 18, "lt": "Đông máu & tiêu fibrin", "sec": "Heparin", "q": "Heparin được chỉ định khi nào?", "opts": ["Tác dụng nhanh nên dùng cấp cứu, dùng ngắn ngày; không qua nhau thai nên dùng được cho phụ nữ có thai", "Chỉ dùng đường uống", "Chống chỉ định cho phụ nữ có thai", "Chỉ dùng điều trị ngoại trú dài ngày"], "ans": 0, "ex": "Chỉ định: phòng và điều trị huyết khối tĩnh mạch sâu, tắc mạch phổi, mạch vành, 1–2 tuần sau nhồi máu cơ tim."}, {"l": 18, "lt": "Đông máu & tiêu fibrin", "sec": "Heparin", "q": "Chất giải độc của heparin là:", "opts": ["Acid tranexamic", "Huyết tương đông lạnh", "Vitamin K", "Protamin sulfat, 1 mg trung hòa 100 đơn vị heparin"], "ans": 3, "ex": "Protamin sulfat phải tiêm tĩnh mạch chậm."}, {"l": 18, "lt": "Đông máu & tiêu fibrin", "sec": "Heparin", "q": "Thuốc ức chế trực tiếp thrombin nào có nguồn gốc từ con đỉa?", "opts": ["Argatroban", "Dabigatran", "Lepivudin (hirudin tái tổ hợp)", "Bivalirudin"], "ans": 2, "ex": "Lepivudin ức chế thrombin không hồi phục, theo dõi bằng aPTT, nhược điểm là sinh kháng thể nếu truyền lâu; chỉ định cho giảm tiểu cầu do heparin (HIT type II)."}, {"l": 18, "lt": "Đông máu & tiêu fibrin", "sec": "Heparin", "q": "Thuốc ức chế trực tiếp thrombin nào dùng đường UỐNG?", "opts": ["Argatroban", "Bivalirudin", "Lepivudin", "Dabigatran"], "ans": 3, "ex": "Dabigatran ít tương tác do không qua CYP450; chỉ định thay khớp gối (10 ngày) và khớp háng (28–35 ngày)."}, {"l": 18, "lt": "Đông máu & tiêu fibrin", "sec": "Heparin", "q": "Argatroban cần giảm liều ở bệnh nhân:", "opts": ["Suy thận", "Người cao tuổi", "Bệnh gan, vì thuốc thanh thải qua gan", "Suy tim"], "ans": 2, "ex": "Argatroban dùng cho HIT type II và kỹ thuật mạch vành ở bệnh nhân HIT type II."}, {"l": 18, "lt": "Đông máu & tiêu fibrin", "sec": "Heparin", "q": "Fondaparinux có đặc điểm:", "opts": ["Dùng đường uống", "Tăng nguy cơ giảm tiểu cầu hơn heparin", "Gắn ATIII và ức chế cả thrombin", "Là pentasaccharid tổng hợp, KHÔNG gắn ATIII, chỉ ức chế Xa mà không ức chế thrombin, tiêm dưới da hằng ngày"], "ans": 3, "ex": "Fondaparinux ít gây giảm tiểu cầu hơn heparin nhưng giảm thải trừ khi suy thận; chỉ định phòng và trị huyết khối tĩnh mạch sâu, thuyên tắc phổi."}, {"l": 18, "lt": "Đông máu & tiêu fibrin", "sec": "Heparin", "q": "Đặc điểm chung của nhóm \"-xaban\" là:", "opts": ["Phải theo dõi aPTT", "Ức chế trực tiếp thrombin", "Tất cả đều dùng đường uống, ức chế trực tiếp yếu tố Xa", "Tất cả đều tiêm dưới da"], "ans": 2, "ex": "Riv ẩn cấp", "q": "Levonorgestrel liều cao dùng tránh thai khẩn cấp có hiệu quả trong vòng:", "opts": ["7 ngày sau giao hợp", "120 giờ sau giao hợp", "24 giờ sau giao hợp", "72 giờ sau giao hợp"], "ans": 3, "ex": "Ulipristal dùng 1 liều duy nhất, hiệu quả trong vòng 120 giờ."}, {"l": 19, "lt": "Thuốc tránh thai", "sec": "Tránh thai khẩn cấp", "q": "Ulipristal có bản chất là:", "opts": ["Một estrogen tổng hợp", "Chất điều biến chọn lọc receptor progesteron tổng hợp", "Một progestogen liều cao", "Chất ức chế aromatase"], "ans": 1, "ex": "Dùng 1 liều duy nhất trong vòng 120 giờ sau giao hợp."}, {"l": 19, "lt": "Thuốc tránh thai", "sec": "Tránh thai khẩn cấp", "q": "Cơ chế chính của thuốc tránh thai khẩn cấp là:", "opts": ["Ức chế hoặc làm chậm đỉnh LH nên ức chế, trì hoãn phóng noãn", "Diệt tinh trùng trong âm đạo", "Gây sẩy thai khi hợp tử đã làm tổ", "Ức chế FSH là cơ chế duy nhất"], "ans": 0, "ex": "Cơ chế bổ sung: nội mạc tử cung kém phát triển, thay đổi dịch nhày cổ tử cung, cản trở di chuyển của tinh trùng và trứng trong vòi tử cung."}, {"l": 19, "lt": "Thuốc tránh thai", "sec": "Tránh thai khẩn cấp", "q": "Tác dụng không mong muốn đặc thù của ulipristal so với levonorgestrel là:", "opts": ["Buồn nôn và nôn", "Rối loạn kinh nguyệt", "Đau đầu", "Rối loạn thị lực, khô miệng, rối loạn cảm xúc, mất định hướng, đau cơ, tổn thương da"], "ans": 3, "ex": "Tác dụng phụ chung của nhóm khẩn cấp: chóng mặt, đau đầu, buồn nôn, nôn, đau bụng dưới, tiêu chảy, rối loạn kinh nguyệt, đau vú, mệt mỏi."}, {"l": 19, "lt": "Thuốc tránh thai", "sec": "So sánh", "q": "So sánh cơ chế 3 loại thuốc tránh thai, ý nào ĐÚNG?", "opts": ["Loại progestogen đơn thuần không có cơ chế ức chế rụng trứng rõ rệt, cơ chế chủ yếu là làm đặc dịch nhày cổ tử cung", "Loại khẩn cấp không ảnh hưởng nội mạc tử cung", "Loại phối hợp không ảnh hưởng dịch nhày cổ tử cung", "Cả ba loại đều ức chế rụng trứng như nhau"], "ans": 0, "ex": "Cả ba loại đều có điểm chung là làm nội mạc tử cung kém phát triển khiến hợp tử không làm tổ được."}]
;
/* ---------- state ---------- */
const S={list:[],i:0,mode:'quiz',answered:{},flipped:false,exam:false,examEnd:0,examTimer:null};
const KEY='dlls_recall_v1';
let store={wrong:{},seen:{}};
try{const r=localStorage.getItem(KEY); if(r) store=Object.assign(store,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
const $=id=>document.getElementById(id);
const LESSONS=[...new Map(BANK.map(q=>[q.l,q.lt])).entries()].sort((a,b)=>a[0]-b[0]);
BANK.forEach((q,i)=>q.id=i);
$('count').textContent=BANK.length+' câu';

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function updWrong(){$('nWrong').textContent=Object.keys(store.wrong).length;}

/* ---------- home ---------- */
function home(){
  stopExam();
  $('play').classList.add('hide');$('result').classList.add('hide');$('foot').classList.add('hide');
  $('home').classList.remove('hide');$('prog').style.width='0%';
  const done=Object.keys(store.seen).length;
  let h=`<div class="card"><div class="row" style="justify-content:space-between">
    <div><b>Chọn bài để ôn</b><div class="note">Đã làm ${done}/${BANK.length} câu · còn ${Object.keys(store.wrong).length} câu sai cần ôn lại</div></div>
    <div class="row"><button class="sm" id="bAll">Ôn tất cả</button><button class="sm" id="bReset">Xóa tiến độ</button></div>
  </div></div><div class="grid">`;
  for(const [n,t] of LESSONS){
    const qs=BANK.filter(q=>q.l===n);
    const d=qs.filter(q=>store.seen[q.id]).length;
    const w=qs.filter(q=>store.wrong[q.id]).length;
    h+=`<div class="lesson" data-l="${n}"><div><b>Bài ${n}. ${t}</b><div class="n">${qs.length} câu · đã làm ${d}${w?` · sai ${w}`:''}</div></div><span class="pill">${Math.round(d/qs.length*100)}%</span></div>`;
  }
  h+='</div>';
  $('home').innerHTML=h;
  $('bAll').onclick=()=>start(BANK);
  $('bReset').onclick=()=>{if(confirm('Xóa toàn bộ tiến độ và danh sách câu sai?')){store={wrong:{},seen:{}};save();updWrong();home();}};
  document.querySelectorAll('.lesson').forEach(e=>e.onclick=()=>start(BANK.filter(q=>q.l==e.dataset.l)));
  updWrong();
}

/* ---------- session ---------- */
function start(list,opt){
  opt=opt||{};
  if(!list.length){alert('Không có câu nào.');return;}
  S.list=($('selOrder').value==='rand'||opt.rand)?shuffle(list):list.slice();
  if(opt.limit) S.list=S.list.slice(0,opt.limit);
  S.i=0;S.answered={};S.mode=opt.flash?'flash':$('selMode').value;S.exam=!!opt.exam;
  $('home').classList.add('hide');$('result').classList.add('hide');
  $('play').classList.remove('hide');$('foot').classList.remove('hide');
  if(S.exam){S.examEnd=Date.now()+30*60*1000;$('timer').classList.remove('hide');tick();S.examTimer=setInterval(tick,1000);}
  render();
}
function stopExam(){if(S.examTimer){clearInterval(S.examTimer);S.examTimer=null;}$('timer').classList.add('hide');}
function tick(){
  const left=Math.max(0,S.examEnd-Date.now());
  const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);
  const t=$('timer');t.textContent=`${m}:${String(s).padStart(2,'0')}`;
  t.classList.toggle('low',left<5*60*1000);
  if(left<=0){stopExam();finish();}
}

function render(){
  const q=S.list[S.i];
  $('prog').style.width=((S.i+1)/S.list.length*100)+'%';
  const ok=Object.values(S.answered).filter(a=>a.ok).length;
  const no=Object.values(S.answered).filter(a=>!a.ok).length;
  $('sOk').textContent=ok+' đúng';$('sNo').textContent=no+' sai';
  if(S.mode==='flash') return renderFlash(q);
  const a=S.answered[q.id];
  let h=`<div class="card"><div class="meta"><span>Bài ${q.l}. ${q.lt}${q.sec?' · '+q.sec:''}</span><span>${S.i+1}/${S.list.length}</span></div>
    <div class="qt">${esc(q.q)}</div>`;
  q.opts.forEach((o,k)=>{
    let cls='';
    if(a&&!S.exam){ if(k===q.ans) cls=' good'; else if(k===a.pick) cls=' bad'; }
    else if(a&&S.exam&&k===a.pick) cls=' good';
    h+=`<button class="opt${cls}" data-k="${k}" ${a?'disabled':''}><span class="k">${'ABCD'[k]}</span><span>${esc(o)}</span></button>`;
  });
  if(a&&!S.exam) h+=`<div class="ex"><b>${a.ok?'Chính xác.':'Chưa đúng.'}</b> ${esc(q.ex)}</div>`;
  h+='</div>';
  if(!a) h+=`<div class="note center">Bấm phương án hoặc gõ <kbd>A</kbd> <kbd>B</kbd> <kbd>C</kbd> <kbd>D</kbd> · <kbd>→</kbd> câu sau</div>`;
  $('play').innerHTML=h;
  $('play').querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
}
function renderFlash(q){
  const h=`<div class="card fc"><div class="meta"><span>Bài ${q.l}. ${q.lt}</span><span>${S.i+1}/${S.list.length}</span></div>
   <div class="big">${esc(q.q)}</div>
   ${S.flipped?`<div style="margin-top:16px"><div class="opt good"><span class="k">✓</span><span>${esc(q.opts[q.ans])}</span></div><div class="ex">${esc(q.ex)}</div></div>`
   :`<div class="center note" style="margin-top:18px">Nghĩ đáp án rồi bấm <kbd>Space</kbd> hoặc nút bên dưới để lật</div>`}
   <div class="center" style="margin-top:14px"><button class="pri" id="bFlip">${S.flipped?'Câu sau →':'Lật thẻ'}</button></div></div>`;
  $('play').innerHTML=h;
  $('bFlip').onclick=()=>{ if(S.flipped){S.flipped=false;next();} else {S.flipped=true;render();} };
}
function pick(k){
  const q=S.list[S.i];
  if(S.answered[q.id])return;
  const ok=k===q.ans;
  S.answered[q.id]={pick:k,ok};
  store.seen[q.id]=1;
  if(ok) delete store.wrong[q.id]; else store.wrong[q.id]=1;
  save();updWrong();render();
  if(S.exam) setTimeout(next,160);
}
function next(){ if(S.i<S.list.length-1){S.i++;S.flipped=false;render();} else finish(); }
function prev(){ if(S.i>0){S.i--;S.flipped=false;render();} }

/* ---------- result ---------- */
function finish(){
  stopExam();
  const done=Object.entries(S.answered);
  if(!done.length){home();return;}
  const ok=done.filter(([,a])=>a.ok).length;
  const pct=Math.round(ok/done.length*100);
  const wrongQ=S.list.filter(q=>S.answered[q.id]&&!S.answered[q.id].ok);
  let h=`<div class="card center"><div class="stat">
    <div><div class="v">${pct}%</div><div class="l">điểm</div></div>
    <div><div class="v" style="color:var(--ok)">${ok}</div><div class="l">đúng</div></div>
    <div><div class="v" style="color:var(--no)">${done.length-ok}</div><div class="l">sai</div></div>
    <div><div class="v">${done.length}</div><div class="l">đã làm</div></div></div>
    <div class="row" style="justify-content:center">
      ${wrongQ.length?'<button class="pri" id="bRedo">Làm lại '+wrongQ.length+' câu sai</button>':''}
      <button id="bHome2">Về mục lục</button></div></div>`;
  if(wrongQ.length){
    h+='<div class="card"><b>Xem lại câu sai</b><div style="margin-top:10px">';
    wrongQ.forEach(q=>{
      h+=`<div class="rev"><div class="q">Bài ${q.l} · ${esc(q.q)}</div>
        <div class="a"><s>Bạn chọn: ${esc(q.opts[S.answered[q.id].pick])}</s><br><i>Đáp án: ${esc(q.opts[q.ans])}</i></div>
        <div class="ex" style="margin-top:7px">${esc(q.ex)}</div></div>`;
    });
    h+='</div></div>';
  }
  $('play').classList.add('hide');$('foot').classList.add('hide');
  $('result').classList.remove('hide');$('result').innerHTML=h;
  if(wrongQ.length)$('bRedo').onclick=()=>start(wrongQ);
  $('bHome2').onclick=home;
}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

/* ---------- wiring ---------- */
$('bHome').onclick=home;
$('bNext').onclick=next;
$('bPrev').onclick=prev;
$('bEnd').onclick=finish;
$('bWrong').onclick=()=>{const l=BANK.filter(q=>store.wrong[q.id]);if(!l.length){alert('Chưa có câu sai nào. Làm vài câu đã nhé.');return;}start(l);};
$('bExam').onclick=()=>start(BANK,{rand:true,limit:50,exam:true});
$('selMode').onchange=()=>{if(!$('play').classList.contains('hide')){S.mode=$('selMode').value;S.flipped=false;render();}};
document.addEventListener('keydown',e=>{
  if($('play').classList.contains('hide'))return;
  const k=e.key.toLowerCase();
  if(S.mode==='flash'&&(k===' '||e.key==='Enter')){e.preventDefault();$('bFlip').click();return;}
  if('abcd'.includes(k)) pick('abcd'.indexOf(k));
  else if('1234'.includes(k)) pick(+k-1);
  else if(e.key==='ArrowRight') next();
  else if(e.key==='ArrowLeft') prev();
});
home();
</script>
</body>
</html>
